<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoulders 😇😈</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Caveat:wght@600&family=Inter:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <!-- TensorFlow.js + MoveNet (pose detection) for shoulder tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  </head>
  <body>
    <!-- Ambient split background: hell (left) vs heaven (right) -->
    <div class="realm hell" aria-hidden="true">
      <span class="ember"></span><span class="ember"></span><span class="ember"></span>
      <span class="ember"></span><span class="ember"></span><span class="ember"></span>
    </div>
    <div class="realm heaven" aria-hidden="true">
      <span class="cloud"></span><span class="cloud"></span><span class="cloud"></span>
    </div>
    <div class="seam" aria-hidden="true"></div>

    <header>
      <h1 class="title">
        <span class="flank devil">😈</span>
        <span class="word">Shoulders</span>
        <span class="flank angel">😇</span>
      </h1>
    </header>

    <main id="stage" class="stage">
      <div class="stage-frame" aria-hidden="true"></div>

      <!-- You, center stage -->
      <video id="user-video" class="user-video" autoplay playsinline muted></video>

      <!-- Good conscience -->
      <figure id="angel" class="avatar angel">
        <div class="halo"></div>
        <video id="angel-video" autoplay playsinline></video>
        <figcaption id="angel-caption" class="caption"></figcaption>
        <span class="badge">😇</span>
      </figure>

      <!-- Bad conscience -->
      <figure id="devil" class="avatar devil">
        <div class="halo"></div>
        <video id="devil-video" autoplay playsinline></video>
        <figcaption id="devil-caption" class="caption"></figcaption>
        <span class="badge">😈</span>
      </figure>

      <div id="you-said" class="you-said"></div>

      <!-- Face-capture guide for "Use my face" -->
      <div id="capture-overlay" class="capture-overlay" hidden>
        <div class="face-guide"></div>
        <div class="capture-text">Center your face in the oval &amp; hold still</div>
        <div class="capture-count"></div>
      </div>

      <!-- Voice-record guide for "Use my voice" -->
      <div id="voice-overlay" class="capture-overlay" hidden>
        <div class="capture-text">🎙️ Read this aloud, clearly:</div>
        <div class="voice-prompt"></div>
        <div class="capture-count"></div>
      </div>
    </main>

    <div class="controls">
      <button id="connect" class="btn primary">Summon them</button>
      <button id="face" class="btn face" disabled>👤 Use my face</button>
      <button id="voice" class="btn voice" disabled>🎙️ Use my voice</button>
      <label class="btn upload" title="Upload a voice clip instead">
        ⤓<input id="voice-file" type="file" accept="audio/*" hidden />
      </label>
      <button id="talk" class="btn talk" disabled>🎤 Hold to talk</button>
      <input
        id="text-input"
        class="text-input"
        type="text"
        placeholder="…or type a question and hit Enter"
        disabled
      />
    </div>
    <p id="status" class="status"></p>

    <footer class="credits">
      Powered by <strong>D-ID</strong> avatars · <strong>ElevenLabs</strong> voices · <strong>OpenAI</strong> vision
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
