<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shoulders 😇😈</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="icon" type="image/png" href="assets/favicon.png" />
    <link rel="apple-touch-icon" href="assets/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <!-- Font Awesome Pro kit (Duotone). Replace REPLACE_WITH_YOUR_KIT_ID with
         your kit from https://fontawesome.com/kits (Pro account required). -->
    <script src="https://kit.fontawesome.com/REPLACE_WITH_YOUR_KIT_ID.js" crossorigin="anonymous"></script>
    <!-- TensorFlow.js + MoveNet (pose detection) for shoulder tracking -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-converter@4.22.0/dist/tf-converter.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl@4.22.0/dist/tf-backend-webgl.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection@2.1.3/dist/pose-detection.min.js"></script>
  </head>
  <body>
    <!-- Soft ambient glows: angel-gold (left) and devil-red (right) -->
    <div class="realm heaven" aria-hidden="true"></div>
    <div class="realm hell" aria-hidden="true"></div>
    <img class="brand-watermark" src="assets/favicon.png" alt="" aria-hidden="true" />

    <header>
      <h1 class="title">
        <img class="logo" src="assets/title.png" alt="Shoulders — your angel and your devil" />
      </h1>
    </header>

    <main id="stage" class="stage">
      <div class="stage-frame" aria-hidden="true"></div>

      <!-- You, center stage -->
      <video id="user-video" class="user-video" autoplay playsinline muted></video>

      <!-- Idle placeholder (hidden once connected) -->
      <div class="stage-empty" aria-hidden="true">
        <div class="empty-faces">😇&nbsp;😈</div>
        <p class="empty-title">Two minds. Zero agreement.</p>
        <p class="empty-sub">Press <strong>Summon them</strong> — then allow camera &amp; mic.</p>
      </div>

      <!-- Good conscience -->
      <figure id="angel" class="avatar angel">
        <div class="halo"></div>
        <video id="angel-video" autoplay playsinline></video>
        <figcaption id="angel-caption" class="caption"></figcaption>
        <span class="badge">😇</span>
      </figure>

      <!-- Bad conscience -->
      <figure id="devil" class="avatar devil">
        <div class="halo"></div>
        <video id="devil-video" autoplay playsinline></video>
        <figcaption id="devil-caption" class="caption"></figcaption>
        <span class="badge">😈</span>
      </figure>

      <div id="you-said" class="you-said"></div>

      <!-- Face-capture guide for "Use my face" -->
      <div id="capture-overlay" class="capture-overlay" hidden>
        <div class="face-guide"></div>
        <div class="capture-text">Center your face in the oval &amp; hold still</div>
        <div class="capture-count"></div>
      </div>

      <!-- Voice-record guide for "Use my voice" -->
      <div id="voice-overlay" class="capture-overlay" hidden>
        <div class="capture-text"><i class="fa-duotone fa-microphone-lines"></i> Read this aloud, clearly:</div>
        <div class="voice-prompt"></div>
        <div class="capture-count"></div>
      </div>
    </main>

    <div class="controls">
      <button id="connect" class="btn primary">
        <i class="fa-duotone fa-wand-magic-sparkles"></i><span class="lbl">Summon them</span>
      </button>
      <button id="face" class="btn face" disabled>
        <i class="fa-duotone fa-face-viewfinder"></i><span class="lbl">Use my face</span>
      </button>
      <button id="voice" class="btn voice" disabled>
        <i class="fa-duotone fa-microphone-lines"></i><span class="lbl">Use my voice</span>
      </button>
      <label class="btn upload" title="Upload a voice clip instead of recording" aria-label="Upload a voice clip">
        <i class="fa-duotone fa-file-audio"></i><input id="voice-file" type="file" accept="audio/*" hidden />
      </label>
      <button id="talk" class="btn talk" disabled>
        <i class="fa-duotone fa-microphone"></i><span class="lbl">Hold to talk</span>
      </button>
      <input
        id="text-input"
        class="text-input"
        type="text"
        placeholder="…or type a question and hit Enter"
        disabled
      />
    </div>
    <p id="status" class="status"></p>

    <footer class="credits">
      Powered by <strong>D-ID</strong> avatars · <strong>ElevenLabs</strong> voices · <strong>OpenAI</strong> vision
    </footer>

    <script type="module" src="app.js"></script>
  </body>
</html>
